apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worthfold-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worthfold-postgres
spec:
  serviceName: worthfold-postgres
  replicas: 1
  selector:
    matchLabels:
      app: worthfold-postgres
  template:
    metadata:
      labels:
        app: worthfold-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Le même réglage que compose.yaml : une base d'une personne dans 512 Mo.
          args:
            - -c
            - max_connections=20
            - -c
            - shared_buffers=128MB
            - -c
            - effective_cache_size=384MB
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=64MB
            - -c
            - random_page_cost=1.1
            - -c
            - checkpoint_completion_target=0.9
            - -c
            - idle_in_transaction_session_timeout=60s
            - -c
            - log_min_duration_statement=500ms
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: worthfold-postgres-secrets
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: worthfold-postgres-secrets
                  key: password
            - name: POSTGRES_DB
              value: worthfold
            # Somme de contrôle des pages : une corruption silencieuse du disque se détecte.
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d worthfold"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d worthfold"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: worthfold-postgres-data
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: worthfold-postgres
spec:
  selector:
    app: worthfold-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  type: ClusterIP
