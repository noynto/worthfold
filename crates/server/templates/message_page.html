{% extends "base.html" %}
{# Une page qui n'a qu'un message à dire (introuvable, indisponible) : où l'on est et comment repartir. #}
{% block title %}{{ title }} · worthfold{% endblock %}
{% block content %}
<section class="rounded-xl bg-surface-container-low p-6 md:p-8">
  <h1 class="text-headline-small">{{ title }}</h1>
  <p class="mt-2 text-body-large text-on-surface-variant">{{ message }}</p>
  <a href="{{ link }}" class="btn-filled mt-6">{{ link_label }}</a>
</section>
{% endblock %}
